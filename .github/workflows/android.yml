name: Build ReelVoice APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Download Vosk Spanish Model
        run: |
          mkdir -p app/src/main/assets/model-es
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -O model.zip
          unzip -q model.zip
          cp -r vosk-model-small-es-0.42/* app/src/main/assets/model-es/
          rm -rf model.zip vosk-model-small-es-0.42

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReelVoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
